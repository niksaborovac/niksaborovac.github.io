<main id="main" class="contact-page">
  <div class="contact-grid">
    <section class="contact-details" aria-labelledby="contact-heading">
      <h1 id="contact-heading">CONTACT</h1>
      <p class="intro">Open to collaborations, internships, and professional opportunities worldwide.</p>
      <div class="email-block">
        <p>E - mail</p>
        <div class="email-row">
          <a href="mailto:niksa.borovac@stud.plus.ac.at">niksa.borovac@stud.plus.ac.at</a>
          <button class="copy-email" type="button" data-copy-email="niksa.borovac@stud.plus.ac.at" aria-label="Copy email address" title="Copy email address">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>

        </div>
        <p class="copy-status" data-copy-status role="status"></p>
      </div>
      <p class="location">Currently based in Salzburg, Austria</p>
    </section>
    <section class="contact-form-card" aria-labelledby="form-heading">
      <h2 id="form-heading">Get in Touch</h2>
      <form class="contact-form" data-recipient="niksa.borovac@stud.plus.ac.at" action="mailto:niksa.borovac@stud.plus.ac.at" method="get">
        <label class="sr-only" for="contact-name">Your Name</label>
        <input id="contact-name" name="name" type="text" placeholder="Your Name" required autocomplete="name" maxlength="150">
        <label class="sr-only" for="contact-email">Your Email</label>
        <input id="contact-email" name="email" type="email" placeholder="Your Email" required autocomplete="email" maxlength="254">
        <label class="sr-only" for="contact-message">Your Message</label>
        <textarea id="contact-message" name="message" rows="5" placeholder="Your Message" required maxlength="4000"></textarea>
        <button type="submit">Send Message</button>
        <p class="form-note" data-form-status aria-live="polite">Opens a draft in your email app for you to send.</p>
      </form>
    </section>
  </div>
